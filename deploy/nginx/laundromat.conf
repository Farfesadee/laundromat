# Pre-TLS LAUNDROMAT reverse proxy.
# Port 80 answers only the Let's Encrypt challenge. Once the certificate
# exists, install laundromat.tls.conf. This file is never used for plaintext
# logins or API traffic.

server {
    listen 80;
    listen [::]:80;
    server_name laundromat.accredit.vip api.laundromat.accredit.vip;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        default_type text/plain;
        return 503 "LAUNDROMAT is being secured. Try again in a moment.";
    }
}
