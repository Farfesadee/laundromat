name: laundromat

# Self-hosted compose (Caddy terminates TLS). On hosts that already run a
# reverse proxy, use docker-compose.prod.yml and the nginx config instead.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN is required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL is required}
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-laundromat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-laundromat}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laundromat}
      POSTGRES_USER: ${POSTGRES_USER:-laundromat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laundromat} -d ${POSTGRES_DB:-laundromat}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  caddy_data:
  caddy_config:
