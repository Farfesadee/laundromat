version: "3.9"
services:
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [web, api]
  web:
    build: ../web
    environment: [NEXT_PUBLIC_API_URL=https://api.spinease.com/api/v1, NEXT_PUBLIC_WS_URL=wss://api.spinease.com/ws]
  api:
    build: ../backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: [../backend/.env]
    depends_on: [postgres, redis]
  worker:
    build: ../backend
    command: arq app.workers.jobs.WorkerSettings
    env_file: [../backend/.env]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment: [POSTGRES_DB=spinease, POSTGRES_USER=spinease, POSTGRES_PASSWORD=change-me]
    volumes: [pg_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
volumes: { pg_data: {}, redis_data: {}, caddy_data: {}, caddy_config: {} }
